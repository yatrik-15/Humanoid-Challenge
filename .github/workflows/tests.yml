name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries for Open3D
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libgomp1
      - name: Test dependencies (geometry only; the tests need no GPU and no model weights)
        run: |
          pip install numpy==2.5.3 scipy==1.18.1 open3d==0.20.0 pycolmap==4.2.1 pydantic==2.14.1 \
            opencv-python-headless==5.0.0.93 imageio==2.38.1 av==19.0.1 pyyaml==6.0.3 \
            scikit-learn==1.9.1 matplotlib==3.11.2 pillow==12.3.0 pytest==9.1.1 ruff==0.17.0
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q
